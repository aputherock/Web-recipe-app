<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-Fo3rlrZj/kTc2f9Gk6kN+...yourHashHere..."
      crossorigin="anonymous"
      referrerpolicy="no-referrer"/>

    <title>Recipe App</title>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
      <img src="logo.jpg" alt="Logo" />
        <h1>Recipe App</h1>
        <form>
          <input
            type="text"
            placeholder="Search for Recipes"
            class="Searchbox"/>
          <button type="submit" class="searchBtn">Search</button>
        </form>
      </nav>
    </header>
    <main>
      <section>
        <div class="recipe-container">
           <img src="img.png" alt="" class="bgim">
          <h2>Search Your Favorite Recipes.........</h2>
          <img src="img.png" alt="" class="bgim">
        </div>
        <div class="recipe-details">
          <button type="button" class="recipe-close-btn">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <div class="recipe-details-content"></div>
        </div>
      </section>
    </main>
   <!-- Animated Footer - Now properly positioned at bottom -->
    <footer>
      <div class="footer-bg-animation"></div>
      
     <!-- Animated Footer - Now properly positioned at bottom -->
    <footer>
      <div class="footer-bg-animation"></div>
      
      <!-- Floating Recipe Icons -->
      <div class="floating-icon">
        <i class="fas fa-utensils"></i>
      </div>
      <div class="floating-icon">
        <i class="fas fa-cookie-bite"></i>
      </div>
      <div class="floating-icon">
        <i class="fas fa-pizza-slice"></i>
      </div>
      
      <div class="footer-content">
        <div class="developer-info">
          <div class="developer-name">
            <span class="animated-text">Developed with ❤️ by Apurba Goswami</span>
          </div>
          <div class="developer-email">
            <i class="fas fa-envelope"></i>
            <span class="animated-text">apurbagoswami211@gmail.com</span>
          </div>
        </div>
        
        <div class="copyright">
          <span class="animated-text">
            © 2025 Recipe App. All rights reserved. | Made with passion for food lovers everywhere.
          </span>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
